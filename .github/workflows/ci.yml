name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security scan (secrets, personal files, local paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/public_scan.py

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.6"
      - run: ruff check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" mypy types-PyYAML
      - run: mypy cvtitan/profile.py cvtitan/registry.py cvtitan/db.py cvtitan/evidence.py cvtitan/purge.py cvtitan/i18n.py cvtitan/messages.py cvtitan/markets.py cvtitan/sources.py cvtitan/scoring.py cvtitan/send_policy.py cvtitan/llm_privacy.py cvtitan/profile_checks.py cvtitan/weekly.py cvtitan/vault.py cvtitan/cv_diff.py cvtitan/import_experience.py cvtitan/funnel.py cvtitan/profile_schema.py cvtitan/web/guard.py cvtitan/commands/_common.py cvtitan/commands/vault.py cvtitan/utils.py cvtitan/taxonomy.py cvtitan/privacy.py cvtitan/net.py cvtitan/market.py cvtitan/job_dictionary.py cvtitan/recruiter.py cvtitan/interview.py cvtitan/job_intel.py cvtitan/importer.py cvtitan/geo.py cvtitan/local_sources.py cvtitan/fx.py cvtitan/colors.py cvtitan/report.py cvtitan/cv_writer.py cvtitan/apply/ats_boards.py cvtitan/apply/forms.py cvtitan/autopilot.py cvtitan/llm.py cvtitan/telemetry.py cvtitan/pipeline.py cvtitan/banner.py cvtitan/apply/answers.py cvtitan/apply/legal.py cvtitan/apply/platforms.py cvtitan/apply/linkedin_guard.py cvtitan/apply/human_browser.py cvtitan/web/app.py cvtitan/web/insights.py cvtitan/knowledge.py cvtitan/commands/interview.py

  docker:
    name: Docker image builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t titan-cv .
      - run: docker run --rm titan-cv --help

  package:
    name: Wheel installs and runs from an empty directory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel in a clean venv and use it like an end user
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          mkdir "$RUNNER_TEMP/work" && cd "$RUNNER_TEMP/work"
          "$RUNNER_TEMP/venv/bin/cvtitan" --help > /dev/null
          "$RUNNER_TEMP/venv/bin/cvtitan" init --listar | grep -q software
          "$RUNNER_TEMP/venv/bin/cvtitan" init --plantilla software
          "$RUNNER_TEMP/venv/bin/cvtitan" validate | grep -q "Profile is valid"
          test -d candidate && test -d data
          # nada se escribe dentro del paquete instalado
          ! ls "$RUNNER_TEMP"/venv/lib/python*/site-packages/cvtitan/data 2>/dev/null

  audit:
    name: Dependency audit (pip-audit, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.lock

  tests:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    needs: security
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests with coverage (browser end-to-end tests skip when Chrome is unavailable)
        run: python -m pytest -q --cov=cvtitan --cov-report=term-missing:skip-covered --cov-fail-under=58
